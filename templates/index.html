<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello World & Calculator Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .nav-links {
            margin-bottom: 20px;
        }
        
        .nav-links a {
            margin: 0 10px;
            text-decoration: none;
            color: #0066cc;
        }
        
        .calculator {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        .calculations-section {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            text-align: left;
        }
        
        .calculations-section h2 {
            text-align: center;
        }
        
        .form-group {
            margin: 10px 0;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        input, select {
            margin: 5px;
            padding: 8px;
            width: 200px;
            box-sizing: border-box;
        }
        
        button {
            padding: 8px 15px;
            margin: 5px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #0052a3;
        }
        
        .result {
            margin-top: 10px;
            font-weight: bold;
            color: green;
        }
        
        .message {
            margin-top: 10px;
            font-weight: bold;
        }
        
        .error {
            color: red;
        }
        
        .success {
            color: green;
        }
        
        .calculations-list {
            margin-top: 20px;
        }
        
        .calculation-item {
            padding: 10px;
            margin: 10px 0;
            background-color: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .calculation-info {
            flex: 1;
        }
        
        .calculation-actions {
            display: flex;
            gap: 10px;
        }
        
        .calculation-actions button {
            padding: 5px 10px;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    
    <div class="nav-links">
        <a href="/register">Register</a> |
        <a href="/login">Login</a>
    </div>
    
    <div class="calculator">
        <h2>Quick Calculator</h2>
        <input type="number" id="a" placeholder="First number">
        <input type="number" id="b" placeholder="Second number"><br>
        <button onclick="calculate('add')">Add</button>
        <button onclick="calculate('subtract')">Subtract</button>
        <button onclick="calculate('multiply')">Multiply</button>
        <button onclick="calculate('divide')">Divide</button>
        <div class="result" id="result"></div>
    </div>
    
    <div class="calculations-section">
        <h2>Saved Calculations</h2>
        
        <div class="form-group">
            <label for="calc-a">First Number:</label>
            <input type="number" id="calc-a" placeholder="Enter first number">
        </div>
        
        <div class="form-group">
            <label for="calc-b">Second Number:</label>
            <input type="number" id="calc-b" placeholder="Enter second number">
        </div>
        
        <div class="form-group">
            <label for="calc-type">Operation:</label>
            <select id="calc-type">
                <option value="add">Add</option>
                <option value="subtract">Subtract</option>
                <option value="multiply">Multiply</option>
                <option value="divide">Divide</option>
            </select>
        </div>
        
        <button onclick="createCalculation()">Add Calculation</button>
        <button onclick="loadCalculations()">Refresh List</button>
        <div class="message" id="operation-message"></div>
        
        <div class="calculations-list" id="calculations-list"></div>
    </div>

    <script>
        function getToken() {
            return sessionStorage.getItem('access_token');
        }
        
        function setToken(token) {
            sessionStorage.setItem('access_token', token);
        }
        
        window.addEventListener('load', function() {
            if (getToken()) {
                loadCalculations();
            }
        });
        
        async function calculate(operation) {
            const a = parseFloat(document.getElementById('a').value);
            const b = parseFloat(document.getElementById('b').value);
            const resultElement = document.getElementById('result');
    
            try {
                const response = await fetch('/' + operation, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ a: a, b: b })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultElement.textContent = 'Result: ' + data.result;
                    resultElement.className = 'result';
                } else {
                    resultElement.textContent = 'Error: ' + data.error;
                    resultElement.className = 'result error';
                }
            } catch (error) {
                console.error('Fetch error:', error);
                resultElement.textContent = 'Error: ' + error.message;
                resultElement.className = 'result error';
            }
        }
        
        async function createCalculation() {
            const token = getToken();
            if (!token) {
                showMessage('Please log in to save calculations.', 'error');
                return;
            }
            
            const a = parseFloat(document.getElementById('calc-a').value);
            const b = parseFloat(document.getElementById('calc-b').value);
            const type = document.getElementById('calc-type').value;
            
            if (isNaN(a) || isNaN(b)) {
                showMessage('Please enter valid numbers.', 'error');
                return;
            }
            
            try {
                const response = await fetch('/calculations', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ a, b, type })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Calculation added successfully!', 'success');
                    document.getElementById('calc-a').value = '';
                    document.getElementById('calc-b').value = '';
                    loadCalculations();
                } else {
                    showMessage('Error: ' + (data.error || 'Failed to add calculation'), 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function loadCalculations() {
            const token = getToken();
            if (!token) {
                document.getElementById('calculations-list').innerHTML = '<p>Please log in to view calculations.</p>';
                return;
            }
            
            try {
                const response = await fetch('/calculations', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    const listElement = document.getElementById('calculations-list');
                    if (data.length === 0) {
                        listElement.innerHTML = '<p>No calculations yet. Create one above!</p>';
                        return;
                    }
                    
                    listElement.innerHTML = data.map(calc => `
                        <div class="calculation-item">
                            <div class="calculation-info">
                                <strong>${calc.a} ${getOperationSymbol(calc.type)} ${calc.b} = ${calc.result}</strong>
                                <br>
                                <small>ID: ${calc.id}</small>
                            </div>
                            <div class="calculation-actions">
                                <button onclick="editCalculation('${calc.id}', ${calc.a}, ${calc.b}, '${calc.type}')">Edit</button>
                                <button onclick="deleteCalculation('${calc.id}')">Delete</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('calculations-list').innerHTML = '<p>Error loading calculations.</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('calculations-list').innerHTML = '<p>Error loading calculations.</p>';
            }
        }
        
        function getOperationSymbol(type) {
            const symbols = {
                'add': '+',
                'subtract': '-',
                'multiply': '×',
                'divide': '÷'
            };
            return symbols[type] || type;
        }
        
        function editCalculation(id, a, b, type) {
            document.getElementById('calc-a').value = a;
            document.getElementById('calc-b').value = b;
            document.getElementById('calc-type').value = type;
            
            const createBtn = document.querySelector('button[onclick="createCalculation()"]');
            createBtn.textContent = 'Update Calculation';
            createBtn.onclick = function() { updateCalculation(id); };
        }
        
        async function updateCalculation(id) {
            const token = getToken();
            if (!token) {
                showMessage('Please log in.', 'error');
                return;
            }
            
            const a = parseFloat(document.getElementById('calc-a').value);
            const b = parseFloat(document.getElementById('calc-b').value);
            const type = document.getElementById('calc-type').value;
            
            if (isNaN(a) || isNaN(b)) {
                showMessage('Please enter valid numbers.', 'error');
                return;
            }
            
            try {
                const response = await fetch('/calculations/' + id, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ a, b, type })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Calculation updated successfully!', 'success');
                    document.getElementById('calc-a').value = '';
                    document.getElementById('calc-b').value = '';
                    document.querySelector('button[onclick="createCalculation()"]').textContent = 'Add Calculation';
                    document.querySelector('button[onclick="createCalculation()"]').onclick = createCalculation;
                    loadCalculations();
                } else {
                    showMessage('Error: ' + (data.error || 'Failed to update calculation'), 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        async function deleteCalculation(id) {
            const token = getToken();
            if (!token) {
                showMessage('Please log in.', 'error');
                return;
            }
            
            if (!confirm('Are you sure you want to delete this calculation?')) {
                return;
            }
            
            try {
                const response = await fetch('/calculations/' + id, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                
                if (response.ok || response.status === 204) {
                    showMessage('Calculation deleted successfully!', 'success');
                    loadCalculations();
                } else {
                    const data = await response.json();
                    showMessage('Error: ' + (data.error || 'Failed to delete calculation'), 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }
        
        function showMessage(message, type) {
            const messageElement = document.getElementById('operation-message');
            messageElement.textContent = message;
            messageElement.className = 'message ' + type;
        }
    </script>
</body>
</html>
